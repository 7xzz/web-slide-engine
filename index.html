<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slide Engine</title>
    <link href="./css/colors.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
  </head>
  <body>
    <section class="slide">

      <div data-flip data-height="256px" data-width="128px" class="card center">
        This is a flipping card
      </div>

      <div data-fade data-height="256px" data-width="128px" class="card center">
        This is a fading card
      </div>

    </section>

    <section class="slide">
      
      <div data-timeline>
        <div data-year="1999" data-title="Year" data-content="Desc" class="timeline-element"></div>
        <div data-year="2000" data-title="Year" data-content="Desc" class="timeline-element"></div>
        <div data-year="2001" data-title="Year" data-content="Desc" class="timeline-element"></div>
      </div>
      
    </section>
  </body>
  <script src="./index.js"></script>
</html>
